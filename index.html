<!DOCTYPE html>
<html>
<head>
    <title>Private Leak Index</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            flex: 1;
            min-width: 300px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }
        button {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            color: #ffff00;
            margin: 10px 0;
            min-height: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #1a1a1a;
            color: #00ff00;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #1a1a1a;
        }
        .stats {
            color: #888;
            font-size: 0.9em;
            margin: 10px 0;
        }
        .password {
            font-family: monospace;
            color: #ff6600;
        }
        .error {
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>[ PRIVATE LEAK SEARCH ]</h1>

    <div class="controls" id="search-controls" style="display: none;">
        <input type="text" id="query" placeholder="Search email or domain (or leave empty to show all)...">
        <button id="searchBtn" onclick="search()">Search</button>
        <button id="browseBtn" onclick="browseAll()">Browse All</button>
        <button id="clearBtn" onclick="clearResults()">Clear</button>
    </div>

    <div id="auth-screen" style="display: block;">
        <div style="max-width: 400px; margin: 100px auto; text-align: center;">
            <h2 style="margin-bottom: 20px;">🔒 AUTHENTICATION REQUIRED</h2>
            <p style="color: #888; margin-bottom: 30px;">Enter password to access leaked database</p>
            <input type="password" id="auth-password" placeholder="Enter password..." style="width: 100%; margin-bottom: 10px;">
            <button id="auth-submit" style="width: 100%;">Unlock</button>
            <div id="auth-error" style="color: #ff0000; margin-top: 10px; display: none;">Invalid password</div>
        </div>
    </div>

    <div id="app-screen" style="display: none;">
        <div id="status">Initializing database...</div>
        <div class="stats" id="stats"></div>
        <div id="results"></div>
    </div>

    <script type="module">
        import * as duckdb from 'https://esm.sh/@duckdb/duckdb-wasm@1.28.0';

        let db = null;
        let conn = null;
        let authenticated = false;

        // Password hash (SHA-256 of "leakdb2024")
        // Change this to your own password hash
        const PASSWORD_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function authenticate() {
            const passwordInput = document.getElementById('auth-password');
            const password = passwordInput.value;
            const hash = await hashPassword(password);

            if (hash === PASSWORD_HASH) {
                authenticated = true;
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('search-controls').style.display = 'flex';
                await initDB();
            } else {
                document.getElementById('auth-error').style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // Check if already authenticated in this session
        if (sessionStorage.getItem('authenticated') === 'true') {
            authenticated = true;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('search-controls').style.display = 'flex';
            initDB();
        }

        // Auth event listeners
        document.getElementById('auth-submit').addEventListener('click', authenticate);
        document.getElementById('auth-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                authenticate();
            }
        });

        async function initDB() {
            if (!authenticated) return;
            try {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Loading DuckDB...';

                // Initialize DuckDB with jsdelivr CDN bundle
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const logger = new duckdb.ConsoleLogger();
                const worker = await duckdb.createWorker(bundle.mainWorker);
                db = new duckdb.AsyncDuckDB(logger, worker);
                await db.instantiate(bundle.mainModule);
                conn = await db.connect();

                statusEl.textContent = 'Loading leak data...';

                // Load parquet files from server
                await loadParquetFiles();

                statusEl.textContent = 'Database ready. You can search or browse leaked credentials.';
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('browseBtn').disabled = false;

                // Try to get initial stats
                await updateStats();

            } catch (error) {
                console.error('Error initializing database:', error);
                document.getElementById('status').innerHTML =
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function loadParquetFiles() {
            // Fetch list of parquet files from GitHub
            const leakFiles = ['sample_leak.parquet']; // Add more files as needed

            for (const file of leakFiles) {
                try {
                    const response = await fetch(`leaks/${file}`);
                    const buffer = await response.arrayBuffer();
                    await db.registerFileBuffer(file, new Uint8Array(buffer));
                } catch (error) {
                    console.error(`Failed to load ${file}:`, error);
                }
            }
        }

        async function updateStats() {
            try {
                const result = await conn.query(`
                    SELECT COUNT(*) as total
                    FROM parquet_scan(['sample_leak.parquet'])
                `);
                const total = result.toArray()[0].total;
                document.getElementById('stats').textContent =
                    `Total records in database: ${total.toLocaleString()}`;
            } catch (error) {
                // Database might be empty, that's ok
                console.log('No data yet:', error);
            }
        }

        window.search = async function() {
            const query = document.getElementById('query').value.trim();
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');

            if (!conn) {
                statusEl.innerHTML = '<span class="error">Database not initialized</span>';
                return;
            }

            try {
                statusEl.textContent = 'Searching...';
                resultsEl.innerHTML = '';

                let sql;
                if (query === '') {
                    // Show all with limit
                    sql = `
                        SELECT email, password
                        FROM parquet_scan(['sample_leak.parquet'])
                        LIMIT 100
                    `;
                } else if (query.includes('@')) {
                    // Search by exact email
                    sql = `
                        SELECT email, password
                        FROM parquet_scan(['sample_leak.parquet'])
                        WHERE email ILIKE '%${query.replace(/'/g, "''")}%'
                        LIMIT 100
                    `;
                } else {
                    // Search by domain
                    sql = `
                        SELECT email, password
                        FROM parquet_scan(['sample_leak.parquet'])
                        WHERE email ILIKE '%@%${query.replace(/'/g, "''")}%'
                        LIMIT 100
                    `;
                }

                const result = await conn.query(sql);
                const rows = result.toArray();

                if (rows.length === 0) {
                    statusEl.textContent = 'No results found.';
                    resultsEl.innerHTML = '<p>No matching records.</p>';
                    return;
                }

                statusEl.textContent = `Found ${rows.length} result(s) ${rows.length === 100 ? '(limited to 100)' : ''}`;

                // Create table
                let html = '<table><thead><tr><th>Email</th><th>Password</th></tr></thead><tbody>';
                rows.forEach(row => {
                    html += `<tr>
                        <td>${escapeHtml(row.email)}</td>
                        <td class="password">${escapeHtml(row.password)}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                resultsEl.innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                statusEl.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        };

        window.browseAll = async function() {
            document.getElementById('query').value = '';
            await search();
        };

        window.clearResults = function() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('query').value = '';
            document.getElementById('status').textContent = 'Results cleared.';
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow search on Enter key
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                search();
            }
        });

        // Note: initDB() is called after successful authentication, not on page load
    </script>
</body>
</html>
