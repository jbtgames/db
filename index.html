<!DOCTYPE html>
<html>
<head>
    <title>Private Leak Index</title>
    <script type="module">
        // Firebase configuration - REPLACE WITH YOUR OWN CONFIG
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // Firebase project configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBWB70Of_5u61P3_k3wUqu9-vXF8_pFbVE",
            authDomain: "data-ffb0e.firebaseapp.com",
            projectId: "data-ffb0e",
            storageBucket: "data-ffb0e.firebasestorage.app",
            messagingSenderId: "728832010449",
            appId: "1:728832010449:web:28acb2c6b9020a56ff3df0",
            measurementId: "G-GQ6GD0W7NB"
        };

        window.firebaseApp = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(window.firebaseApp);
    </script>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            flex: 1;
            min-width: 300px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }
        button {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            color: #ffff00;
            margin: 10px 0;
            min-height: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #1a1a1a;
            color: #00ff00;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #1a1a1a;
        }
        .stats {
            color: #888;
            font-size: 0.9em;
            margin: 10px 0;
        }
        .password {
            font-family: monospace;
            color: #ff6600;
        }
        .error {
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>[ PRIVATE LEAK SEARCH ]</h1>

    <div class="controls" id="search-controls" style="display: none;">
        <input type="text" id="query" placeholder="Search email or domain (or leave empty to show all)...">
        <button id="searchBtn" onclick="search()">Search</button>
        <button id="browseBtn" onclick="browseAll()">Browse All</button>
        <button id="clearBtn" onclick="clearResults()">Clear</button>
        <button onclick="document.getElementById('file-upload').click()" style="background: #1a4d1a; border-color: #00ff00;">📁 Upload</button>
        <button onclick="logout()" style="background: #660000; border-color: #ff0000; color: #ff0000;">Logout</button>
        <input type="file" id="file-upload" accept=".txt,.csv" style="display: none;" onchange="handleFileUpload(event)">
    </div>

    <div id="auth-screen" style="display: block;">
        <div style="max-width: 400px; margin: 100px auto; text-align: center;">
            <h2 style="margin-bottom: 20px;">🔒 AUTHENTICATION REQUIRED</h2>
            <p style="color: #888; margin-bottom: 30px;">Sign in to access leaked database</p>
            <input type="email" id="auth-email" placeholder="Email..." style="width: 100%; margin-bottom: 10px;">
            <input type="password" id="auth-password" placeholder="Password..." style="width: 100%; margin-bottom: 10px;">
            <button id="auth-submit" style="width: 100%;">Sign In</button>
            <div id="auth-error" style="color: #ff0000; margin-top: 10px; display: none;"></div>
            <div id="auth-loading" style="color: #ffff00; margin-top: 10px; display: none;">Authenticating...</div>
        </div>
    </div>

    <div id="app-screen" style="display: none;">
        <div id="status">Initializing database...</div>
        <div class="stats" id="stats"></div>
        <div id="results"></div>
    </div>

    <script type="module">
        import * as duckdb from 'https://esm.sh/@duckdb/duckdb-wasm@1.28.0';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        let db = null;
        let conn = null;
        let authenticated = false;
        let loadedFiles = []; // Track all loaded parquet files
        const auth = window.firebaseAuth;

        async function authenticate() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');
            const errorEl = document.getElementById('auth-error');
            const loadingEl = document.getElementById('auth-loading');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorEl.textContent = 'Please enter both email and password';
                errorEl.style.display = 'block';
                return;
            }

            try {
                errorEl.style.display = 'none';
                loadingEl.style.display = 'block';

                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged will handle the UI update

            } catch (error) {
                loadingEl.style.display = 'none';
                console.error('Auth error:', error);

                let message = 'Authentication failed';
                if (error.code === 'auth/invalid-credential') {
                    message = 'Invalid email or password';
                } else if (error.code === 'auth/user-not-found') {
                    message = 'User not found';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Incorrect password';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Invalid email address';
                } else if (error.code === 'auth/network-request-failed') {
                    message = 'Network error - check your connection';
                }

                errorEl.textContent = message;
                errorEl.style.display = 'block';
                passwordInput.value = '';
            }
        }

        // Monitor authentication state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in
                authenticated = true;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('search-controls').style.display = 'flex';
                document.getElementById('auth-loading').style.display = 'none';

                // Initialize database
                if (!db) {
                    await initDB();
                }
            } else {
                // User is signed out
                authenticated = false;
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('search-controls').style.display = 'none';
            }
        });

        // Auth event listeners
        document.getElementById('auth-submit').addEventListener('click', authenticate);
        document.getElementById('auth-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                authenticate();
            }
        });
        document.getElementById('auth-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('auth-password').focus();
            }
        });

        // Add logout functionality
        window.logout = async function() {
            try {
                await signOut(auth);
                location.reload();
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        async function initDB() {
            if (!authenticated) return;
            try {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Loading DuckDB...';

                // Initialize DuckDB with jsdelivr CDN bundle
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const logger = new duckdb.ConsoleLogger();
                const worker = await duckdb.createWorker(bundle.mainWorker);
                db = new duckdb.AsyncDuckDB(logger, worker);
                await db.instantiate(bundle.mainModule);
                conn = await db.connect();

                statusEl.textContent = 'Loading leak data...';

                // Load parquet files from server
                await loadParquetFiles();

                statusEl.textContent = 'Database ready. You can search or browse leaked credentials.';
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('browseBtn').disabled = false;

                // Try to get initial stats
                await updateStats();

            } catch (error) {
                console.error('Error initializing database:', error);
                document.getElementById('status').innerHTML =
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function loadParquetFiles() {
            // Fetch list of parquet files from GitHub
            const leakFiles = ['sample_leak.parquet']; // Add more files as needed

            for (const file of leakFiles) {
                try {
                    const response = await fetch(`leaks/${file}`);
                    const buffer = await response.arrayBuffer();
                    await db.registerFileBuffer(file, new Uint8Array(buffer));
                    loadedFiles.push(file);
                } catch (error) {
                    console.error(`Failed to load ${file}:`, error);
                }
            }
        }

        async function updateStats() {
            try {
                if (loadedFiles.length === 0) {
                    document.getElementById('stats').textContent = 'No data loaded yet';
                    return;
                }

                // Build UNION query for all loaded files/tables
                const queries = loadedFiles.map(file => {
                    if (file.startsWith('uploaded_')) {
                        return `SELECT COUNT(*) as count FROM ${file}`;
                    } else {
                        return `SELECT COUNT(*) as count FROM parquet_scan(['${file}'])`;
                    }
                });

                const unionQuery = queries.join(' UNION ALL ');
                const result = await conn.query(`SELECT SUM(count) as total FROM (${unionQuery})`);
                const total = result.toArray()[0].total;

                document.getElementById('stats').textContent =
                    `Total records in database: ${total.toLocaleString()} (${loadedFiles.length} source${loadedFiles.length > 1 ? 's' : ''})`;
            } catch (error) {
                // Database might be empty, that's ok
                console.log('No data yet:', error);
            }
        }

        window.search = async function() {
            const query = document.getElementById('query').value.trim();
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');

            if (!conn) {
                statusEl.innerHTML = '<span class="error">Database not initialized</span>';
                return;
            }

            if (loadedFiles.length === 0) {
                statusEl.innerHTML = '<span class="error">No data loaded. Upload a file or wait for data to load.</span>';
                return;
            }

            try {
                statusEl.textContent = 'Searching...';
                resultsEl.innerHTML = '';

                // Build UNION query for all loaded files/tables
                const queries = loadedFiles.map(file => {
                    let baseQuery;
                    if (file.startsWith('uploaded_')) {
                        baseQuery = `SELECT email, password FROM ${file}`;
                    } else {
                        baseQuery = `SELECT email, password FROM parquet_scan(['${file}'])`;
                    }

                    // Add WHERE clause if searching
                    if (query !== '') {
                        if (query.includes('@')) {
                            // Search by exact email
                            baseQuery += ` WHERE email ILIKE '%${query.replace(/'/g, "''")}%'`;
                        } else {
                            // Search by domain
                            baseQuery += ` WHERE email ILIKE '%@%${query.replace(/'/g, "''")}%'`;
                        }
                    }

                    return baseQuery;
                });

                const unionQuery = queries.join(' UNION ALL ');
                const sql = `SELECT * FROM (${unionQuery}) LIMIT 100`;

                const result = await conn.query(sql);
                const rows = result.toArray();

                if (rows.length === 0) {
                    statusEl.textContent = 'No results found.';
                    resultsEl.innerHTML = '<p>No matching records.</p>';
                    return;
                }

                statusEl.textContent = `Found ${rows.length} result(s) ${rows.length === 100 ? '(limited to 100)' : ''}`;

                // Create table
                let html = '<table><thead><tr><th>Email</th><th>Password</th></tr></thead><tbody>';
                rows.forEach(row => {
                    html += `<tr>
                        <td>${escapeHtml(row.email)}</td>
                        <td class="password">${escapeHtml(row.password)}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                resultsEl.innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                statusEl.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        };

        window.browseAll = async function() {
            document.getElementById('query').value = '';
            await search();
        };

        window.clearResults = function() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('query').value = '';
            document.getElementById('status').textContent = 'Results cleared.';
        };

        window.handleFileUpload = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.textContent = `Uploading ${file.name}...`;

            try {
                // Read file content
                const text = await file.text();
                const lines = text.split('\n').filter(line => line.trim());

                if (lines.length === 0) {
                    statusEl.innerHTML = '<span class="error">File is empty</span>';
                    return;
                }

                // Parse lines (email:password or email,password)
                const delimiter = text.includes(':') ? ':' : ',';
                const data = lines.map(line => {
                    const parts = line.trim().split(delimiter);
                    return {
                        email: parts[0]?.trim() || '',
                        password: parts[1]?.trim() || ''
                    };
                }).filter(row => row.email && row.password);

                if (data.length === 0) {
                    statusEl.innerHTML = '<span class="error">No valid email:password pairs found</span>';
                    return;
                }

                statusEl.textContent = `Processing ${data.length} records...`;

                // Create table in DuckDB from uploaded data
                const fileName = file.name.replace(/\.(txt|csv)$/, '');
                const tableName = `uploaded_${fileName.replace(/[^a-zA-Z0-9_]/g, '_')}`;

                // Insert data into a new table
                await conn.query(`CREATE TABLE IF NOT EXISTS ${tableName} (email VARCHAR, password VARCHAR)`);

                // Batch insert data
                for (const row of data) {
                    await conn.query(`INSERT INTO ${tableName} VALUES ('${row.email.replace(/'/g, "''")}', '${row.password.replace(/'/g, "''")}')`);
                }

                // Track this as a loaded "file"
                loadedFiles.push(tableName);

                statusEl.textContent = `✓ Uploaded ${file.name} (${data.length} records)`;
                await updateStats();

                // Clear the file input so the same file can be re-uploaded
                event.target.value = '';

            } catch (error) {
                console.error('Upload error:', error);
                statusEl.innerHTML = `<span class="error">Upload failed: ${error.message}</span>`;
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow search on Enter key
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                search();
            }
        });

        // Note: initDB() is called after successful authentication, not on page load
    </script>
</body>
</html>
